<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to your LittleLux parent account to manage bookings, view party details and track your celebration planning." />
  <title>Sign In — LittleLux Parent Portal</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body class="login-page">

  <main class="login-container" role="main">
    <div class="login-card" role="region" aria-labelledby="login-title">

      <!-- Brand -->
      <div class="login-brand">
        <a href="../index.html" class="navbar-logo" aria-label="LittleLux Home" style="text-decoration:none">
          <div class="logo-icon" aria-hidden="true"><svg class="svg-icon icon-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v4"/><path d="m12 6-8 7h16z"/><path d="M4 13v8h16v-8"/><path d="M12 13v8"/><path d="M8 21v-4a4 4 0 0 1 8 0v4"/><path d="M12 2c1.5 0 2.5 1 2.5 2"/></svg></div>
          <div class="logo-text">
            <span class="logo-name">LittleLux</span>
            <span class="logo-tagline">Luxury Birthday Venue</span>
          </div>
        </a>
      </div>

      <!-- Heading -->
      <div class="login-header">
        <h1 id="login-title" class="login-title">Welcome <em class="italic-heading">Back!</em></h1>
        <p class="login-subtitle">Sign in to continue to your account.</p>
      </div>

      <!-- Form -->
      <form class="login-form" data-validate data-on-success="onLoginSuccess" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input id="login-email" name="email" type="email" class="form-control" placeholder="you@example.com" autocomplete="email" data-validate="required|email" aria-required="true" />
          <span class="form-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-wrap">
            <input id="login-password" name="password" type="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" data-validate="required" aria-required="true" />
            <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="form-error" aria-live="polite"></span>
        </div>

        <div class="login-options">
          <label class="login-remember" for="remember-me">
            <input id="remember-me" name="remember" type="checkbox" />
            <span>Remember me</span>
          </label>
          <a href="#" class="login-forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary login-submit">Sign In</button>
      </form>

      <!-- Divider -->
      <div class="login-divider" role="separator" aria-label="or continue with">
        <span>or continue with</span>
      </div>

      <!-- Social -->
      <div class="login-social" role="group" aria-label="Social login options">
        <button type="button" class="login-social-btn" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          <span>Google</span>
        </button>
        <button type="button" class="login-social-btn" aria-label="Continue with Facebook">
          <svg viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          <span>Facebook</span>
        </button>
        <button type="button" class="login-social-btn" aria-label="Continue with Apple">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.628-2.324-4.413-2.35-1.93-.154-3.45 1.138-4.083 1.138-.68 0-1.826-.922-3.022-.922zm4.37-2.633c.606-.73 1.018-1.745.909-2.756-.878.035-1.94.584-2.57 1.321-.56.651-.96 1.697-.835 2.698.892.069 1.803-.453 2.496-1.263z"/></svg>
          <span>Apple</span>
        </button>
      </div>

      <!-- Signup -->
      <p class="login-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>

      <p class="login-legal">By signing in you agree to our <a href="privacy.html">Privacy Policy</a> and <a href="terms.html">Terms of Service</a></p>

    </div>
  </main>

  <script src="../js/main.js"></script>
  <script>
    window.onLoginSuccess = function() {
      const email = document.getElementById('login-email')?.value.toLowerCase() || '';
      if (email.includes('admin')) {
        window.location.href = 'admin-dashboard.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    };
    (function() {
      const btn = document.querySelector('[data-password-toggle]');
      const input = document.getElementById('login-password');
      if (!btn || !input) return;
      btn.addEventListener('click', function() {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        this.setAttribute('aria-pressed', isPassword ? 'true' : 'false');
        this.innerHTML = isPassword
          ? '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>'
          : '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
      });
    })();
  </script>
</body>
</html>
