<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Brand Lavender to Deep Royal Violet Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C63AF" />
      <stop offset="45%" stop-color="#664F95" />
      <stop offset="100%" stop-color="#342350" />
    </linearGradient>

    <!-- Champagne Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E1B5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C4A468" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#E8CCA0" stop-opacity="0.95" />
    </linearGradient>

    <!-- Rich Champagne Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="40%" stop-color="#E8C582" />
      <stop offset="100%" stop-color="#B88F46" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#1B0F2E" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Luxury Squircle Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="2.5" />
  <rect x="6.5" y="6.5" width="115" height="115" rx="25.5" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.2" />

  <!-- Castle / Venue Emblem -->
  <g filter="url(#shadow)">
    <!-- Left Turret Battlement -->
    <path d="M22 56 H34 V70 H22 Z" fill="#FFFFFF" />
    <path d="M20 56 L28 44 L36 56 Z" fill="url(#goldAccent)" />

    <!-- Right Turret Battlement -->
    <path d="M94 56 H106 V70 H94 Z" fill="#FFFFFF" />
    <path d="M92 56 L100 44 L108 56 Z" fill="url(#goldAccent)" />

    <!-- Main Grand Hall Triangle Roof -->
    <path d="M64 26 L26 66 H102 Z" fill="#FFFFFF" />

    <!-- Main Castle Wall Base -->
    <path d="M26 66 H102 V103 C102 105 100 107 98 107 H30 C28 107 26 105 26 103 Z" fill="#FFFFFF" />

    <!-- Grand Palace Arched Portal Entrance -->
    <path d="M49 107 V86 C49 77.7 55.7 71 64 71 C72.3 71 79 77.7 79 86 V107 Z" fill="#342350" />
    <path d="M49 107 V86 C49 77.7 55.7 71 64 71 C72.3 71 79 77.7 79 86 V107" fill="none" stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" />

    <!-- Center Spire Flagpole -->
    <line x1="64" y1="10" x2="64" y2="26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Fluttering Celebration Pennant Flag -->
    <path d="M64 10 C74 10 80 13.5 82 17 C80 20.5 74 24 64 24 Z" fill="url(#goldAccent)" />

    <!-- Party Sparkle Magic Stars -->
    <!-- Top Right Sparkle -->
    <path d="M96 22 Q96 29 103 29 Q96 29 96 36 Q96 29 89 29 Q96 29 96 22 Z" fill="url(#goldAccent)" />
    <!-- Top Left Sparkle -->
    <path d="M30 32 Q30 37 35 37 Q30 37 30 42 Q30 37 25 37 Q30 37 30 32 Z" fill="url(#goldAccent)" opacity="0.9" />
  </g>
</svg>
